<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SODA GRAMMATIK KURS · Sophia Deutsch Akademie</title>
<meta name="description" content="Sophia Deutsch Akademie의 독일어 문법 학습 코스. 16개 Lektion을 한곳에서 확인해요.">
<meta name="theme-color" content="#FAFAF8">
<meta name="color-scheme" content="light">
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="apple-touch-icon" href="assets/logo.png">
<link rel="stylesheet" href="assets/pretendard.css">
<style>
:root{
  --accent:#384568;--accent-d:#2C3754;--accent-bg:#ECEDF3;--accent-l:#F5F5F9;
  --text:#1E1E1E;--text-s:#444;--text-m:#666;
  --bg:#FAFAF8;--bg-c:#FFFFFF;--bg-s:#F2F0EB;--bd:#E0E0DB;--bd-l:#ECEAE4;
  --ok:#2D7A56;--ok-bg:#E8F5EE;
  --y:#F1C80F;--r:#ED1C24;--g:#58595B;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:'Pretendard Variable','Noto Sans KR',system-ui,-apple-system,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100svh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}
[hidden]{display:none!important}
#toc:focus,#toc:focus-visible{outline:none}
.view{animation:viewIn .5s var(--ease) both}
.view.leave{animation:viewOut .26s ease both}
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes viewOut{to{opacity:0;transform:translateY(-12px)}}

/* ───────── 표지 ───────── */
.cover{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;padding:clamp(24px,4vw,48px) clamp(24px,7vw,112px);padding-bottom:max(clamp(24px,3vw,36px),env(safe-area-inset-bottom));background:var(--bg)}
.brand{display:flex;align-items:center;gap:14px;animation:fade .9s .05s ease both}
.brand img{height:40px;width:auto;display:block}
.brand-t{display:flex;flex-direction:column;line-height:1.25}
.brand-t b{font-size:15px;font-weight:700;letter-spacing:.2px}
.brand-t span{font-size:12.5px;color:var(--text-m);font-weight:500}
.hero{flex:1;display:flex;flex-direction:column;justify-content:center;padding:clamp(48px,10vh,120px) 0}
h1.title{font-size:clamp(30px,8.6vw,128px);line-height:1.02;letter-spacing:-.045em;color:var(--accent);animation:rise 1s .15s var(--ease) both}
h1.title span{display:block}
h1.title .t1{font-weight:800}
h1.title .t2{font-weight:300;color:var(--text);letter-spacing:-.04em}
.lead{margin-top:clamp(24px,4vh,40px);font-size:clamp(15px,1.5vw,17px);color:var(--text-m);max-width:38em;word-break:keep-all;animation:rise 1s .3s var(--ease) both}
.cta{margin-top:clamp(40px,7vh,64px);align-self:flex-start;display:inline-flex;align-items:center;gap:14px;height:56px;padding:0 26px 0 30px;border-radius:10px;background:var(--accent);color:#fff;font-size:16px;font-weight:700;letter-spacing:.2px;transition:background .2s,gap .25s var(--ease);animation:rise 1s .45s var(--ease) both}
.cta svg{width:18px;height:18px}
.cta:hover{background:var(--accent-d);gap:20px}
.cta:focus-visible{outline-offset:4px;border-radius:10px}
.cover-foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:20px;border-top:1px solid var(--bd);font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-m);font-weight:600;animation:fade 1s .6s ease both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ───────── 목차 ───────── */
.toc{max-width:1080px;margin:0 auto;padding:0 clamp(16px,4vw,32px) 72px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 0}
.top-brand{display:flex;align-items:center;gap:12px;min-width:0}
.top-brand img{height:34px;width:auto}
.top-brand b{font-size:15px;font-weight:800;letter-spacing:.14em;white-space:nowrap}
.top-brand span{font-size:12.5px;color:var(--text-m);font-weight:500;display:block;letter-spacing:.2px;line-height:1.2}
.back{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border:1px solid var(--bd);border-radius:999px;background:var(--bg-c);font-size:13px;font-weight:600;color:var(--text-s);transition:border-color .15s,color .15s}
.back:hover{border-color:var(--accent);color:var(--accent)}
.back svg{width:14px;height:14px}

/* 필터 + 카드 */
.bar-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:44px 0 18px}
.bar-h h2{font-size:22px;font-weight:800;letter-spacing:-.01em}
.bar-h h2 span{display:block;font-size:12.5px;font-weight:700;letter-spacing:.2em;color:var(--text-m);margin-bottom:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px;list-style:none}
.card{position:relative;display:flex;flex-direction:column;height:100%;padding:20px 22px 20px;background:var(--bg-c);border:1px solid var(--bd);border-radius:18px;transition:transform .25s var(--ease),box-shadow .25s var(--ease),border-color .2s}
.card.in{animation:rise .6s var(--ease) both;animation-delay:calc(var(--i)*35ms)}
.card:hover{transform:translateY(-4px);border-color:#C9CDDB;box-shadow:0 18px 34px -22px rgba(56,69,104,.55)}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
.num{font-size:44px;font-weight:800;line-height:1;letter-spacing:-.04em;color:var(--accent);font-variant-numeric:tabular-nums}
.ico{width:44px;height:44px;border-radius:12px;background:var(--accent-bg);color:var(--accent);display:flex;align-items:center;justify-content:center}
.ico svg{width:24px;height:24px}
.ko{font-size:19px;font-weight:800;line-height:1.35;word-break:keep-all;letter-spacing:-.01em}
.de{font-size:13.5px;color:var(--text-m);font-weight:500;margin-top:2px;font-style:italic}
.desc{font-size:14px;color:var(--text-s);line-height:1.6;margin:12px 0 18px;word-break:keep-all;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.empty{grid-column:1/-1;text-align:center;color:var(--text-m);padding:48px 0;font-size:15px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media(max-width:720px){
  .top-brand span{display:none}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-delay:0ms!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>

<!-- ───────── 표지 ───────── -->
<main id="cover" class="cover view" aria-labelledby="cover-title">
  <header class="brand">
    <img src="assets/logo.png" alt="Sophia Deutsch Akademie 로고">
    <div class="brand-t"><b>Sophia Deutsch Akademie</b><span>소피아 독일어학원</span></div>
  </header>
  <div class="hero">
    <h1 class="title" id="cover-title"><span class="t1">SODA</span><span class="t2">GRAMMATIK KURS</span></h1>
    <button type="button" class="cta" id="start">학습 시작하기
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h12M11 5l5 5-5 5"/></svg>
    </button>
  </div>
  <footer class="cover-foot"><span>Innovative Learning Beyond the Traditional</span><span>Lektion 01 – 16</span></footer>
</main>

<!-- ───────── 목차 ───────── -->
<main id="toc" class="toc view" hidden aria-labelledby="toc-title" tabindex="-1">
  <div class="top">
    <div class="top-brand">
      <img src="assets/logo.png" alt="">
      <div><b>SODA GRAMMATIK KURS</b><span>Sophia Deutsch Akademie</span></div>
    </div>
    <a class="back" href="#" id="to-cover">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg>표지
    </a>
  </div>

    <div class="bar-h">
    <h2 id="toc-title"><span>INHALT</span>목차</h2>
  </div>
  <ul class="grid" id="grid"></ul>
</main>

/* ── 렌더 ── */
function render(){
  $('grid').innerHTML=LESSONS.map(function(l,i){
    return'<li><a class="card'+(animateNext?' in':'')+'" style="--i:'+i+'" href="'+href(l)+'">'
      +'<div class="card-top"><span class="num">'+l.n+'</span><span class="ico">'+l.icon+'</span></div>'
      +'<h3 class="ko">'+l.ko+'</h3><p class="de" lang="de">'+l.de+'</p><p class="desc">'+l.desc+'</p></a></li>';
  }).join('');
  animateNext=false;
}

/* ── 화면 전환 ── */
var cover=$('cover'),toc=$('toc'),first=true;
function show(isToc,animate){
  if(isToc){
    cover.hidden=true;toc.hidden=false;
    toc.classList.remove('leave');
    toc.style.animation='none';void toc.offsetWidth;toc.style.animation='';
    animateNext=true;window.scrollTo(0,0);render();
    if(!first)toc.focus({preventScroll:true});
  }else{
    toc.hidden=true;cover.hidden=false;cover.classList.remove('leave');
    window.scrollTo(0,0);
  }
  first=false;
}
function route(){show(location.hash==='#toc');}
$('start').addEventListener('click',function(){
  if(reduce){location.hash='#toc';return;}
  cover.classList.add('leave');
  setTimeout(function(){location.hash='#toc';},230);
});
$('to-cover').addEventListener('click',function(e){
  e.preventDefault();
  history.pushState('',document.title,location.pathname+location.search);
  route();
});
window.addEventListener('hashchange',route);
window.addEventListener('popstate',route);

})();
