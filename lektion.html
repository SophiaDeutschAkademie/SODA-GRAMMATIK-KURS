<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lektion · SODA GRAMMATIK KURS</title>
<meta name="description" content="Sophia Deutsch Akademie의 독일어 문법 학습 코스. 교재, 과제, 연습문제 중 하나를 골라요.">
<meta name="theme-color" content="#FAFAF8">
<meta name="color-scheme" content="light">
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="apple-touch-icon" href="assets/logo.png">
<link rel="stylesheet" href="assets/pretendard.css">
<style>
:root{
  --accent:#384568;--accent-d:#2C3754;--accent-bg:#ECEDF3;--accent-l:#F5F5F9;
  --text:#1E1E1E;--text-s:#444;--text-m:#666;
  --bg:#FAFAF8;--bg-c:#FFFFFF;--bg-s:#F2F0EB;--bd:#E0E0DB;--bd-l:#ECEAE4;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:'Pretendard Variable','Noto Sans KR',system-ui,-apple-system,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100svh}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}
[hidden]{display:none!important}

.page{max-width:1040px;margin:0 auto;padding:0 clamp(16px,4vw,32px) 72px;animation:viewIn .5s var(--ease) both}
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 0}
.top-brand{display:flex;align-items:center;gap:12px;min-width:0}
.top-brand img{height:34px;width:auto}
.top-brand b{font-size:15px;font-weight:800;letter-spacing:.14em;white-space:nowrap}
.top-brand span{font-size:12.5px;color:var(--text-m);font-weight:500;display:block;letter-spacing:.2px;line-height:1.2}
.back{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border:1px solid var(--bd);border-radius:999px;background:var(--bg-c);font-size:13px;font-weight:600;color:var(--text-s);transition:border-color .15s,color .15s}
.back:hover{border-color:var(--accent);color:var(--accent)}
.back svg{width:14px;height:14px}

.head{display:flex;align-items:center;gap:clamp(16px,3vw,28px);margin:clamp(32px,7vh,72px) 0 clamp(28px,5vh,48px)}
.head .num{font-size:clamp(64px,13vw,120px);font-weight:800;line-height:.95;letter-spacing:-.05em;color:var(--accent);font-variant-numeric:tabular-nums}
.head .meta{min-width:0}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.2em;color:var(--text-m);margin-bottom:4px}
.head h1{font-size:clamp(24px,4.4vw,38px);font-weight:800;line-height:1.25;letter-spacing:-.02em;word-break:keep-all}
.head .de{font-size:15px;color:var(--text-m);font-weight:500;font-style:italic;margin-top:4px}

.choose{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:16px;list-style:none}
.opt{position:relative;display:flex;flex-direction:column;height:100%;padding:26px 26px 24px;background:var(--bg-c);border:1px solid var(--bd);border-radius:20px;transition:transform .25s var(--ease),box-shadow .25s var(--ease),border-color .25s;animation:rise .6s var(--ease) both;animation-delay:calc(var(--i)*70ms + 120ms)}
.opt:hover{transform:translateY(-4px);border-color:#C9CDDB;box-shadow:0 18px 34px -22px rgba(56,69,104,.55)}
.opt .ico{width:52px;height:52px;border-radius:14px;background:var(--accent-bg);color:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:22px}
.opt .ico svg{width:28px;height:28px}
.opt .kind{font-size:12.5px;font-weight:700;letter-spacing:.2em;color:var(--text-m)}
.opt h2{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.opt p{font-size:14.5px;color:var(--text-s);line-height:1.65;margin:12px 0 26px;word-break:keep-all}
.opt .go{margin-top:auto;display:inline-flex;align-items:center;gap:10px;font-size:15px;font-weight:700;color:var(--accent);transition:gap .2s var(--ease)}
.opt .go svg{width:16px;height:16px}
.opt:hover .go{gap:16px}
.opt.hw .ico{background:var(--accent);color:#fff}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:20px;border-top:1px solid var(--bd)}
.pager a{display:flex;flex-direction:column;gap:2px;max-width:48%;padding:10px 4px;font-size:13px;color:var(--text-m);transition:color .15s}
.pager a:hover{color:var(--accent)}
.pager a b{font-size:15px;font-weight:700;color:var(--text);word-break:keep-all}
.pager a:hover b{color:var(--accent)}
.pager .next{margin-left:auto;text-align:right}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-delay:0ms!important;transition-duration:.001ms!important}
}
@media(max-width:720px){.top-brand span{display:none}}
</style>
</head>
<body>

<div class="page" id="page" hidden>
  <div class="top">
    <div class="top-brand">
      <img src="assets/logo.png" alt="">
      <div><b>SODA GRAMMATIK KURS</b><span>Sophia Deutsch Akademie</span></div>
    </div>
    <a class="back" href="index.html#toc">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg>목차
    </a>
  </div>

  <header class="head">
    <span class="num" id="num"></span>
    <div class="meta">
      <p class="eyebrow">LEKTION</p>
      <h1 id="ko"></h1>
      <p class="de" id="de" lang="de"></p>
    </div>
  </header>

  <ul class="choose">
    <li>
      <a class="opt" id="opt-book" style="--i:0">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6C10 4.8 7.5 4.4 5 4.8v13c2.5-.4 5 0 7 1.2 2-1.2 4.5-1.6 7-1.2v-13c-2.5-.4-5 0-7 1.2zM12 6v12"/></svg></span>
        <span class="kind">LEHRWERK</span>
        <h2>교재</h2>
        <p>문법 설명과 예문을 읽으며 이 과의 내용을 배워요.</p>
        <span class="go">교재 보기<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h12M11 5l5 5-5 5"/></svg></span>
      </a>
    </li>
    <li>
      <a class="opt hw" id="opt-hw" style="--i:1">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 2.8 0l.2.2a2 2 0 0 1 0 2.8L8 19zM14.5 6.5l3 3"/></svg></span>
        <span class="kind">HAUSAUFGABE</span>
        <h2>과제</h2>
        <p>배운 내용을 문제로 풀어 보며 직접 정리해요.</p>
        <span class="go">과제 풀기<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h12M11 5l5 5-5 5"/></svg></span>
      </a>
    </li>
    <li>
      <a class="opt" id="opt-ub" style="--i:2">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6.5l1.6 1.6L8.5 5M4 12.5l1.6 1.6L8.5 11M4 18.5l1.6 1.6L8.5 17M12 7h8M12 13h8M12 19h8"/></svg></span>
        <span class="kind">ÜBUNG</span>
        <h2>연습문제</h2>
        <p>심화 문제를 더 풀어 보며 이 과의 내용을 굳혀요.</p>
        <span class="go">연습문제 풀기<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h12M11 5l5 5-5 5"/></svg></span>
      </a>
    </li>
  </ul>

  <nav class="pager" id="pager" aria-label="다른 Lektion"></nav>
</div>

<noscript><p style="padding:24px;text-align:center">이 학습 앱은 JavaScript가 필요해요.</p></noscript>

<script src="assets/lessons.js"></script>
<script>
(function(){
'use strict';
var L=window.SODA_LESSONS||[];
var n=(new URLSearchParams(location.search).get('n')||'').padStart(2,'0');
var i=L.findIndex(function(x){return x.n===n;});
if(i<0){location.replace('index.html#toc');return;}
var l=L[i],$=function(id){return document.getElementById(id);};

document.title='Lektion '+l.n+' · '+l.ko+' · SODA GRAMMATIK KURS';
$('num').textContent=l.n;
$('ko').textContent=l.ko;
$('de').textContent=l.de;
$('opt-book').href='lektionen/lektion-'+l.n+'.html';
$('opt-hw').href='hausaufgaben/lektionen/lektion-'+l.n+'.html';
$('opt-ub').href='uebungen/lektionen/lektion-'+l.n+'.html';

var p=L[i-1],q=L[i+1],h='';
if(p)h+='<a class="prev" href="lektion.html?n='+p.n+'"><span>← 이전 Lektion</span><b>'+p.n+' · '+p.ko+'</b></a>';
if(q)h+='<a class="next" href="lektion.html?n='+q.n+'"><span>다음 Lektion →</span><b>'+q.n+' · '+q.ko+'</b></a>';
$('pager').innerHTML=h;

$('page').hidden=false;
})();
</script>
</body>
</html>
